$kind: http-request
url: "{{base_url}}me/password"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"current_password\": \"password\",\r

    \    \"password\": \"newPassword\",\r

    \    \"password_confirmation\": \"newPassword\"\r

    }\r\n"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: .resources/change password.resources/examples
order: 4000
