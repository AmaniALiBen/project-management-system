$kind: http-example
request:
  url: "{{base_url}}logout"
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.4.26
    Cache-Control: no-cache, private
    Date: Wed, 28 Oct 2026 12:03:01 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Logged out successfully"
      }
order: 1000
