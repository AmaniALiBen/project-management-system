$kind: http-example
request:
  url: "{{base_url}}me/password"
  method: PATCH
  body:
    type: json
    content: "{\r

      \    \"current_password\": \"password\",\r

      \    \"password\": \"newPassword\",\r

      \    \"password_confirmation\": \"newPassword\"\r

      }\r\n"
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.4.26
    Cache-Control: no-cache, private
    Date: Wed, 28 Oct 2026 12:03:37 GMT
    Content-Type: application/json
    X-RateLimit-Limit: "5"
    X-RateLimit-Remaining: "4"
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "password updated successfully"
      }
order: 1000
